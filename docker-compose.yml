version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: studentos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studentos
      POSTGRES_PASSWORD: studentos_password
      POSTGRES_DB: studentos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
